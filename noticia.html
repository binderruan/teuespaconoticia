<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Notícia</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
async function carregarPost() {
  const params = new URLSearchParams(window.location.search);
  const arquivo = params.get("post");
  if (!arquivo) return;

  try {
    const resposta = await fetch(
      `https://raw.githubusercontent.com/binderruan/teuespaconoticia/main/noticias/${arquivo}`
    );

    const markdown = await resposta.text();

    // Remove primeira imagem do corpo (ela já é capa no card)
    const conteudo = markdown.replace(/!\[.*?\]\(.*?\)/, "");

    document.getElementById("post").innerHTML = `
      <div class="container mt-4">
        ${marked.parse(conteudo)}
      </div>
    `;

  } catch (erro) {
    document.getElementById("post").innerHTML = "Erro ao carregar a notícia.";
    console.error(erro);
  }
}

carregarPost();
</script>


  

</body>
</html>
