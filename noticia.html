<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Notícia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap (mesmo visual do site) -->
  <link rel="stylesheet" href="/teuespaco/bootstrap.css">

  <!-- Biblioteca que converte Markdown em HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

<div id="post"></div> <!-- 🔥 AQUI FICA A NOTÍCIA -->

<script>
async function carregarPost() {
  const params = new URLSearchParams(window.location.search);
  const arquivo = params.get("post");
  if (!arquivo) return;

  try {
    const resposta = await fetch(
      `https://raw.githubusercontent.com/binderruan/teuespaconoticia/main/noticias/${arquivo}`
    );

    const markdown = await resposta.text();

    // Remove a primeira imagem (já usada como capa no card)
    const conteudo = markdown.replace(/!\[.*?\]\(.*?\)/, "");

    document.getElementById("post").innerHTML = `
      <div class="container mt-4">
        ${marked.parse(conteudo)}
      </div>
    `;

  } catch (erro) {
    document.getElementById("post").innerHTML = "Erro ao carregar a notícia.";
    console.error(erro);
  }
}

carregarPost();
</script>

</body>
</html>
