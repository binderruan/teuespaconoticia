<div id="post"></div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
async function carregarPost() {
  const params = new URLSearchParams(window.location.search);
  const arquivo = params.get("post");
  if (!arquivo) return;

  const url = `https://raw.githubusercontent.com/binderruan/teuespaconoticia/main/noticias/${arquivo}`;
  console.log("Buscando:", url);

  try {
    const resposta = await fetch(url);

    if (!resposta.ok) throw new Error("404");

    const texto = await resposta.text();

    // remove bloco do CMS --- ---
    const conteudo = texto.replace(/---[\s\S]*?---/, "");

    document.getElementById("post").innerHTML = marked.parse(conteudo);

  } catch (erro) {
    document.getElementById("post").innerHTML = "<h2>Notícia não encontrada.</h2>";
    console.error("ERRO REAL:", erro);
  }
}

carregarPost();
</script>
