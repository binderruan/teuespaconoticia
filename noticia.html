<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Notícia</title>
  <link rel="stylesheet" href="/teuespaco/bootstrap.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<div id="post"></div>

<script>
async function carregarPost() {
  const params = new URLSearchParams(window.location.search);
  const arquivo = params.get("post");
  if (!arquivo) return;

  try {
    const resposta = await fetch(
      `https://raw.githubusercontent.com/binderruan/teuespaconoticia/main/noticias/${arquivo}`
    );

    if (!resposta.ok) throw new Error("Arquivo não encontrado");

    const markdown = await resposta.text();

    const conteudo = markdown.replace(/!\[.*?\]\(.*?\)/, "");

    document.getElementById("post").innerHTML = `
      <div class="container mt-4">
        ${marked.parse(conteudo)}
      </div>
    `;

  } catch (erro) {
    document.getElementById("post").innerHTML = "<h3>Notícia não encontrada.</h3>";
    console.error(erro);
  }
}

carregarPost();
</script>

</body>
</html>
