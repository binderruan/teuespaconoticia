<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Notícia</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="/teuespaco/bootstrap.css">
</head>

<body>

<div class="container" style="margin-top:40px">
  <div id="post">Carregando notícia...</div>
</div>

<script>
async function carregarPost() {
  const params = new URLSearchParams(window.location.search);
  const arquivo = params.get("post");
  if (!arquivo) return;

  try {
    const resposta = await fetch(
      `https://raw.githubusercontent.com/binderruan/teuespaconoticia/main/noticias/${arquivo}`
    );

    if (!resposta.ok) throw new Error("404");

    const texto = await resposta.text();

    // remove cabeçalho do Netlify CMS (---)
    const conteudo = texto.replace(/---[\s\S]*?---/, "");

    document.getElementById("post").innerHTML = marked.parse(conteudo);

  } catch (erro) {
    document.getElementById("post").innerHTML = "<h2>Notícia não encontrada.</h2>";
    console.error(erro);
  }
}

document.addEventListener("DOMContentLoaded", carregarPost);
</script>

</body>
</html>
