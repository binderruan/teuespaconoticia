name: Extrair edicoes automaticamente

on:
  push:
    paths:
      - "edicoes-impressas.html"

jobs:
  extrair:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v3

      - name: Instalar Node
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Gerar arquivos .md
        run: node extrair-edicoes.js

      - name: Atualizar edicoes.json
        run: node gerar-edicoes.js

      - name: Commit automático
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add edicoes/
          git commit -m "Atualiza edições automaticamente" || echo "Nada para commit"
          git push
