name: Extrair edições automaticamente

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: "18"

      - run: node extrair-edicoes.js
      - run: node gerar-edicoes.js

      - run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add edicoes/
          git commit -m "Atualiza edições automaticamente" || echo "Nada para commit"
          git push
