name: Gerar arquivos de notícias
on:
  workflow_dispatch:
  push:
    paths:
      - "noticias/*.md"
      - "gerar-posts.js"
      - "noticia.html"
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v3
      - name: Instalar Node
        uses: actions/setup-node@v3
        with:
          node-version: "18"
      - name: Rodar script
        run: node gerar-posts.js
      - name: Commit arquivos
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add noticias/posts.json noticias/noticias.json rss.xml materia-*.html
          git commit -m "Atualiza páginas e feed das notícias" || echo "Nada para commit"
          git push
