name: Publicar notícias agendadas no Facebook

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicacoes-agendadas
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verificar e publicar agendamentos vencidos
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: node publicar-agendadas.js
      - name: Salvar histórico da fila
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fila-publicacoes.json
          if git diff --cached --quiet; then
            echo "Nenhuma publicação processada."
          else
            git commit -m "Atualiza histórico de publicações agendadas"
            git push
          fi
