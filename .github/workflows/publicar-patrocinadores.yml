name: Publicar patrocinadores no Facebook e Instagram

on:
  schedule:
    - cron: "23 13,17,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-patrocinadores
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Publicar um patrocinador por horário
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: node publicar-patrocinadores.js

      - name: Salvar controle da rotação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/patrocinadores.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração no controle dos patrocinadores."
          else
            git commit -m "Atualiza rotação de patrocinadores publicados"
            git push
          fi
