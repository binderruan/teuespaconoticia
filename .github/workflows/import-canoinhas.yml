name: Import Canoinhas Atende

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC (ajuste p/ seu horário)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm init -y
      - run: npm i cheerio

      - run: node scripts/import-canoinhas.js

      - name: Commit changes
        run: |
          git config user.name "teuespaco-bot"
          git config user.email "bot@teuespaco.com.br"
          git add noticias/posts.json noticias/*.md
          git commit -m "Import notícias Canoinhas" || echo "Nada novo"
          git push
