name: Publicar notícias da Agência Brasil
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar-agencia-brasil
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Buscar e preparar uma notícia nova por execução
        run: node publicar-agencia-brasil.js
      - name: Atualizar arquivos de notícias e páginas para compartilhamento
        run: node gerar-posts.js
      - name: Salvar notícias no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias/*.md noticias/posts.json noticias/noticias.json noticias/agencia-brasil-horarios.json rss.xml materia-*.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "Publica notícias e atualiza páginas de compartilhamento"
            git push
          fi

      - name: Publicar imediatamente as notícias novas no Facebook
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: node publicar-facebook.js

      - name: Salvar controle das publicações no Facebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias/facebook-publicadas.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração no controle do Facebook."
          else
            git commit -m "Atualiza controle de publicações do Facebook"
            git push
          fi
