                    <script>
function formatarDataPtBr(dataStr) {
  if (!dataStr) return "";

  const meses = [
    "janeiro", "fevereiro", "março", "abril", "maio", "junho",
    "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"
  ];

  // espera formato DD/MM/AAAA
  const partes = dataStr.split("/");
  if (partes.length !== 3) return dataStr;

  const dia = partes[0];
  const mes = parseInt(partes[1], 10) - 1;
  const ano = partes[2];

  if (mes < 0 || mes > 11) return dataStr;

  return `${dia} de ${meses[mes]} de ${ano}`;
}
</script>

<script>
function parseFrontmatter(md) {
  const match = md.match(/^---\s*[\r\n]+([\s\S]*?)\s*[\r\n]+---\s*[\r\n]*/);
  if (!match) return { data: {}, body: md };

  const yaml = match[1];
  const body = md.replace(match[0], "");

  const data = {};
  let currentKey = null;

  yaml.split(/\r?\n/).forEach((line) => {
    if (!line.trim()) return;

    // Se a linha começa com espaços, é continuação do valor anterior
    if (/^\s+/.test(line) && currentKey) {
      data[currentKey] = (data[currentKey] + " " + line.trim())
        .replace(/\s+/g, " ")
        .trim();
      return;
    }

    const m = line.match(/^([^:]+):\s*(.*)$/);
    if (!m) return;

    const key = m[1].trim();
    let value = m[2].trim();

    value = value.replace(/^"(.*)"$/, "$1").replace(/^'(.*)'$/, "$1");

    data[key] = value;
    currentKey = key;
  });

  return { data, body };
}

function normalizarUrlImagem(url) {
  if (!url) return "images/logo.png";

  // Se veio do CMS como /images/uploads/...
  if (url.startsWith("/")) return "https://teuespaco.com.br" + url;

  // Se já é absoluta (http/https)
  if (url.startsWith("http")) return url;

  // Se é relativa tipo images/uploads/...
  return "https://teuespaco.com.br/" + url.replace(/^\.\//, "");
}

async function carregarPost() {
  const params = new URLSearchParams(window.location.search);
  const arquivo = params.get("post");
  if (!arquivo) return;

  try {
    const resposta = await fetch(
      `https://raw.githubusercontent.com/binderruan/teuespaconoticia/main/noticias/${arquivo}`
    );

    if (!resposta.ok) throw new Error("404");

    const texto = await resposta.text();

    // 1) separa frontmatter e corpo
    const { data, body } = parseFrontmatter(texto);

    // 2) Título
    const titulo = data.title || "Notícia";
    document.getElementById("titulo-post").innerText = titulo;
    document.title = titulo + " - Teu Espaço";

    // 3) Data e Categoria
    document.getElementById("data-post").innerText = formatarDataPtBr(data.date);
    document.getElementById("categoria-post").innerText = data.category || "";

    // 4) Imagem (thumbnail do frontmatter)
    const imagem = normalizarUrlImagem(data.thumbnail);
    const imgEl = document.getElementById("imagem-post");

    if (data.thumbnail) {
      imgEl.src = imagem;
      imgEl.style.display = "block";
      document.getElementById("og-image").setAttribute("content", imagem);
    } else {
      // se não tiver thumbnail, esconde a imagem
      imgEl.style.display = "none";
      document.getElementById("og-image").setAttribute("content", "https://teuespaco.com.br/images/logo.png");
    }
      // === CATEGORIA (aceita Categoria: ou category:) ===
const catMatch = texto.match(/^(?:Categoria|category)\s*:\s*(.*)$/im);
document.getElementById("categoria-post").innerText = catMatch ? catMatch[1].trim() : "";

      let bodyFiltrado = body;

// remove só o "X Post"
bodyFiltrado = bodyFiltrado.replace(/X Post/gi, "");

    // 5) Conteúdo (somente o corpo sem frontmatter)
    document.getElementById("conteudo-post").innerHTML = marked.parse(bodyFiltrado);

  } catch (erro) {
    document.getElementById("conteudo-post").innerHTML = "<h2>Notícia não encontrada.</h2>";
    console.error(erro);
  }
}

carregarPost();
    </script>
<script>
async function carregarRelacionadas() {
  const container = document.getElementById("relacionadas");
  if (!container) return;

  const lista = await fetch("/noticias/posts.json").then(r => r.json());

  let noticias = [];

  for (const nome of lista) {

    // Pula a notícia atual
    const atual = new URLSearchParams(window.location.search).get("post");
    if (nome === atual) continue;

    const md = await fetch("/noticias/" + nome).then(r => r.text());

    const { data } = parseFrontmatter(md);
    
    const titulo = (data.title || "Sem título").trim();
    const imagem = data.thumbnail ? normalizarUrlImagem(data.thumbnail.trim()) : "images/logo.png";

    noticias.push({ nome, titulo, imagem });
  }

  // 🔥 embaralha aleatório
  noticias.sort(() => Math.random() - 0.5);

  // 🔥 pega só 3
  noticias = noticias.slice(0, 3);

  // Renderiza
  container.innerHTML = "";

  for (const n of noticias) {
    container.innerHTML += `
      <div class="col-lg-4 mb-4 d-inline-flex">
        <div class="card m-2 videos h-100 w-100">
          <img src="${n.imagem}" class="card-img-top img-fluid" alt="">
          <div class="card-block">
            <h4 class="card-nome">${n.titulo}</h4>
          </div>
          <div class="card-body data">
            <a href="/noticia.html?post=${n.nome}" class="btn btn-primary btn-sm mtn">» Leia mais...</a>
          </div>
        </div>
      </div>
    `;
  }

  // Se não tiver nenhuma
  if (noticias.length === 0) {
    container.innerHTML = "<p>Sem notícias para mostrar.</p>";
  }
}

document.addEventListener("DOMContentLoaded", carregarRelacionadas);
</script>
<script>
let paginaAtual = 1;
const porPagina = 10;
let todasNoticias = [];

async function carregarTodasNoticias() {

  const lista = await fetch("/noticias/posts.json").then(r => r.json());

  todasNoticias = [];

  for (const nome of lista) {
    const md = await fetch("/noticias/" + nome).then(r => r.text());

    const tituloMatch = md.match(/^title:\s*(.*)(?:\r?\n\s+(.*))?/m);
    let titulo = "Sem título";
    if (tituloMatch) {
      titulo = ((tituloMatch[1] || "") + " " + (tituloMatch[2] || ""))
        .replace(/\s+/g, " ")
        .trim();
    }

    const dataMatch = md.match(/^date:\s*(.*)$/m);
    const data = dataMatch ? dataMatch[1].trim() : "";

    const imgMatch = md.match(/^thumbnail:\s*(.*)$/m);
    const imagem = imgMatch ? imgMatch[1].trim() : "images/logo.png";

    todasNoticias.push({ nome, titulo, data, imagem });
  }

  // ordenar por data
  todasNoticias.sort((a, b) => {
    const da = new Date(a.data.split("/").reverse().join("-"));
    const db = new Date(b.data.split("/").reverse().join("-"));
    return db - da;
  });

  renderizarPagina();
}

function renderizarPagina() {

  const container = document.getElementById("lista-todas-noticias");

  const inicio = (paginaAtual - 1) * porPagina;
  const fim = inicio + porPagina;

  const paginaNoticias = todasNoticias.slice(inicio, fim);

  container.innerHTML = "";

  for (const n of paginaNoticias) {
    container.innerHTML += `
      <div class="col-lg-4 mb-4 d-inline-flex">
        <div class="card m-2 videos h-100">
          <img src="${n.imagem}" class="card-img-top img-fluid">
          <div class="card-block">
            <h4 class="card-nome">${n.titulo}</h4>
          </div>
          <div class="card-body data">
            <a href="/noticia.html?post=${n.nome}" class="btn btn-primary btn-sm mtn">» Leia mais...</a>
          </div>
        </div>
      </div>
    `;
  }

  atualizarControles();
}

function atualizarControles() {
  const totalPaginas = Math.ceil(todasNoticias.length / porPagina);

  document.getElementById("pagina-info").innerText =
    `Página ${paginaAtual} de ${totalPaginas}`;

  document.getElementById("btn-anterior").disabled = paginaAtual === 1;
  document.getElementById("btn-proximo").disabled = paginaAtual === totalPaginas;
}

// eventos
document.getElementById("btn-anterior").addEventListener("click", () => {
  paginaAtual--;
  renderizarPagina();
});

document.getElementById("btn-proximo").addEventListener("click", () => {
  paginaAtual++;
  renderizarPagina();
});

// iniciar
carregarTodasNoticias();
</script>

</body></html>
