<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Imagens</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .gallery img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .gallery img:hover {
            transform: scale(1.1);
        }
        /* Modal (imagem ampliada) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            max-width: 90%;
            max-height: 90%;
        }
        .modal-content img {
            width: 100%;
            height: auto;
        }
        .modal img {
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Galeria de Imagens</h1>
    
    <div class="gallery">
        <!-- Imagens numeradas de 1 a 400 -->
        <!-- Exemplo com as imagens numeradas de 1 a 10, e você pode seguir o padrão até a imagem 400 -->
        <!-- Eu substituí o texto 'Imagem N' por números sequenciais -->
        <!-- Abaixo estão as imagens 1 a 10 como exemplo -->
        <img src="https://via.placeholder.com/200x200.png?text=Imagem+1" alt="Imagem 1" onclick="openModal(this)">
        <img src="https://via.placeholder.com/200x200.png?text=Imagem+2" alt="Imagem 2" onclick="openModal(this)">
        <img src="https://via.placeholder.com/200x200.png?text=Imagem+3" alt="Imagem 3" onclick="openModal(this)">
        <img src="https://via.placeholder.com/200x200.png?text=Imagem+4" alt="Imagem 4" onclick="openModal(this)">
        <img src="https://via.placeholder.com/200x200.png?text=Imagem+5" alt="Imagem 5" onclick="openModal(this)">
        <img src="https://via.placeholder.com/200x200.png?text=Imagem+6" alt="Imagem 6" onclick="openModal(this)">
        <img src="https://via.placeholder.com/200x200.png?text=Imagem+7" alt="Imagem 7" onclick="openModal(this)">
        <img src="https://via.placeholder.com/200x200.png?text=Imagem+8" alt="Imagem 8" onclick="openModal(this)">
        <img src="https://via.placeholder.com/200x200.png?text=Imagem+9" alt="Imagem 9" onclick="openModal(this)">
        <img src="https://via.placeholder.com/200x200.png?text=Imagem+10" alt="Imagem 10" onclick="openModal(this)">
        
        <!-- Você pode continuar com a numeração de 11 a 400 da mesma forma -->
        <!-- Exemplo de imagens até 20 -->
        <img src="https://via.placeholder.com/200x200.png?text=Imagem+11" alt="Imagem 11" onclick="openModal(this)">
        <img src="https://via.placeholder.com/200x200.png?text=Imagem+12" alt="Imagem 12" onclick="openModal(this)">
        <img src="https://via.placeholder.com/200x200.png?text=Imagem+13" alt="Imagem 13" onclick="openModal(this)">
        <img src="https://via.placeholder.com/200x200.png?text=Imagem+14" alt="Imagem 14" onclick="openModal(this)">
        <img src="https://via.placeholder.com/200x200.png?text=Imagem+15" alt="Imagem 15" onclick="openModal(this)">
        <img src="https://via.placeholder.com/200x200.png?text=Imagem+16" alt="Imagem 16" onclick="openModal(this)">
        <img src="https://via.placeholder.com/200x200.png?text=Imagem+17" alt="Imagem 17" onclick="openModal(this)">
        <img src="https://via.placeholder.com/200x200.png?text=Imagem+18" alt="Imagem 18" onclick="openModal(this)">
        <img src="https://via.placeholder.com/200x200.png?text=Imagem+19" alt="Imagem 19" onclick="openModal(this)">
        <img src="https://via.placeholder.com/200x200.png?text=Imagem+20" alt="Imagem 20" onclick="openModal(this)">
        
        <!-- Você pode continuar até a imagem 400 -->
    </div>

    <!-- Modal -->
    <div id="myModal" class="modal" onclick="closeModal()">
        <div class="modal-content">
            <img id="modalImage" src="" alt="Imagem ampliada">
        </div>
    </div>

    <script>
        // Função para abrir o modal e mostrar a imagem ampliada
        function openModal(img) {
            const modal = document.getElementById('myModal');
            const modalImg = document.getElementById('modalImage');
            modal.style.display = "flex";
            modalImg.src = img.src;
        }

        // Função para fechar o modal ao clicar fora da imagem
        function closeModal() {
            const modal = document.getElementById('myModal');
            modal.style.display = "none";
        }
    </script>
    
</body>
</html>
