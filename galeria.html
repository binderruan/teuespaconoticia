<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Imagens</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .gallery img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .gallery img:hover {
            transform: scale(1.1);
        }
        /* Modal (imagem ampliada) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            max-width: 90%;
            max-height: 90%;
        }
        .modal-content img {
            width: 100%;
            height: auto;
        }
        .modal img {
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Galeria de Imagens</h1>
    
    <div class="gallery" id="gallery"></div>

    <!-- Modal -->
    <div id="myModal" class="modal" onclick="closeModal()">
        <div class="modal-content">
            <img id="modalImage" src="" alt="Imagem ampliada">
        </div>
    </div>

    <script>
        // Função para gerar as imagens automaticamente
        for (let i = 1; i <= 1380; i++) {
            const img = document.createElement("img");
            img.src = `https://teuespaco.com.br/casamento/1%20(${i}).jpg`;
            img.alt = `Imagem ${i}`;
            img.onclick = function() {
                openModal(img);
            };
            document.getElementById("gallery").appendChild(img);
        }

        // Função para abrir o modal e mostrar a imagem ampliada
        function openModal(img) {
            const modal = document.getElementById('myModal');
            const modalImg = document.getElementById('modalImage');
            modal.style.display = "flex";
            modalImg.src = img.src;
        }

        // Função para fechar o modal ao clicar fora da imagem
        function closeModal() {
            const modal = document.getElementById('myModal');
            modal.style.display = "none";
        }
    </script>
    
</body>
</html>
