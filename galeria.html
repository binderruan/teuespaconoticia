<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Imagens</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .gallery img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .gallery img:hover {
            transform: scale(1.1);
        }
        /* Modal (imagem ampliada) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            max-width: 90%;
            max-height: 90%;
        }
        .modal-content img {
            width: 100%;
            height: auto;
        }
        .modal img {
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Galeria de Imagens</h1>
    
    <div class="gallery">
        <!-- Gerar as imagens de 1 a 10 como exemplo -->
        <img src="https://teuespaco.com.br/casamento/1%20(1).jpg" alt="Imagem 1" onclick="openModal(this)">
        <img src="https://teuespaco.com.br/casamento/1%20(2).jpg" alt="Imagem 2" onclick="openModal(this)">
        <img src="https://teuespaco.com.br/casamento/1%20(3).jpg" alt="Imagem 3" onclick="openModal(this)">
        <img src="https://teuespaco.com.br/casamento/1%20(4).jpg" alt="Imagem 4" onclick="openModal(this)">
        <img src="https://teuespaco.com.br/casamento/1%20(5).jpg" alt="Imagem 5" onclick="openModal(this)">
        <img src="https://teuespaco.com.br/casamento/1%20(6).jpg" alt="Imagem 6" onclick="openModal(this)">
        <img src="https://teuespaco.com.br/casamento/1%20(7).jpg" alt="Imagem 7" onclick="openModal(this)">
        <img src="https://teuespaco.com.br/casamento/1%20(8).jpg" alt="Imagem 8" onclick="openModal(this)">
        <img src="https://teuespaco.com.br/casamento/1%20(9).jpg" alt="Imagem 9" onclick="openModal(this)">
        <img src="https://teuespaco.com.br/casamento/1%20(10).jpg" alt="Imagem 10" onclick="openModal(this)">
    </div>

    <!-- Modal -->
    <div id="myModal" class="modal" onclick="closeModal()">
        <div class="modal-content">
            <img id="modalImage" src="" alt="Imagem ampliada">
        </div>
    </div>

    <script>
        // Função para abrir o modal e mostrar a imagem ampliada
        function openModal(img) {
            const modal = document.getElementById('myModal');
            const modalImg = document.getElementById('modalImage');
            modal.style.display = "flex";
            modalImg.src = img.src;
        }

        // Função para fechar o modal ao clicar fora da imagem
        function closeModal() {
            const modal = document.getElementById('myModal');
            modal.style.display = "none";
        }
    </script>
    
</body>
</html>
