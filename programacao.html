<script>
fetch("/programacao.json")
  .then(res => res.json())
  .then(data => {

    const container = document.getElementById("programacao");
    const grupos = {};

    // 🔥 NORMALIZA OS DIAS (aceita qualquer jeito escrito)
    function normalizarDias(texto) {
      if (!texto) return ["outros"];

      const t = texto.toLowerCase();
      const dias = [];

      if (t.includes("diariamente")) return ["diariamente"];

      if (t.includes("seg")) dias.push("segunda");
      if (t.includes("ter")) dias.push("terça");
      if (t.includes("qua")) dias.push("quarta");
      if (t.includes("qui")) dias.push("quinta");
      if (t.includes("sex")) dias.push("sexta");
      if (t.includes("sáb") || t.includes("sab")) dias.push("sábado");
      if (t.includes("dom")) dias.push("domingo");

      if (dias.length === 0) dias.push("outros");

      return dias;
    }

    // 🔁 AGRUPA POR DIA
    data.forEach(item => {
      const dias = normalizarDias(item.dias);

      dias.forEach(dia => {
        if (!grupos[dia]) grupos[dia] = [];
        grupos[dia].push(item);
      });
    });

    // 📅 ORDEM CERTA
    const ordemDias = [
      "diariamente",
      "segunda",
      "terça",
      "quarta",
      "quinta",
      "sexta",
      "sábado",
      "domingo",
      "outros"
    ];

    // 🧠 ORDENA POR HORÁRIO
    function extrairHora(horario) {
      if (!horario) return 9999;
      const match = horario.match(/(\d{1,2}):(\d{2})/);
      if (!match) return 9999;
      return parseInt(match[1]) * 60 + parseInt(match[2]);
    }

    container.innerHTML = "";

    // 🖥️ EXIBE NA TELA
    ordemDias.forEach(dia => {
      if (grupos[dia]) {

        grupos[dia].sort((a, b) => extrairHora(a.horario) - extrairHora(b.horario));

        const titulo = document.createElement("h2");
        titulo.innerText = dia === "outros"
          ? "OUTROS / NÃO INFORMADO"
          : dia.toUpperCase();

        container.appendChild(titulo);

        grupos[dia].forEach(item => {
          container.innerHTML += `
            <div class="program">
              <img src="${item.image}" alt="${item.title}">
              <div class="program-info">
                <h2>${item.title}</h2>
                <p>${item.dias || "Não informado"}</p>
                <p>Horário: ${item.horario || "Não informado"}</p>
              </div>
            </div>
          `;
        });

      }
    });

  })
  .catch(err => {
    console.error("Erro ao carregar programação:", err);
  });
</script>
