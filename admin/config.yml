backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "noticias"
    label: "Notícias"
    folder: "noticias"
    create: true
    slug: "{{slug}}"
    extension: "md"

    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Imagem de Capa", name: "thumbnail", widget: "image"}
      - {label: "Categoria", name: "categoria", widget: "string"}
      - {label: "Conteúdo", name: "body", widget: "markdown"}

    meta:
      path:
        widget: "hidden"
        default: "{{slug}}.md"
