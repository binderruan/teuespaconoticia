backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "noticias"
    label: "Notícias"
    folder: "noticias"
    create: true
    slug: "{{slug}}"
    format: "json"
    extension: "json"
    fields:
      - { label: "Título", name: "titulo", widget: "string" }
      - { label: "Data", name: "data", widget: "datetime" }
      - { label: "Imagem", name: "imagem", widget: "image" }
      - { label: "Categoria", name: "categoria", widget: "string" }
      - { label: "Conteúdo", name: "conteudo", widget: "markdown" }

